name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp every .js?v=... in the HTML with this commit's ID (deployed copy only)
      - name: Auto-version JS
        run: |
          V="${GITHUB_SHA::7}"
          find . -name '*.html' -not -path './.git/*' -exec sed -i -E "s/(\.js\?v=)[A-Za-z0-9]+/\1$V/g" {} +

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
